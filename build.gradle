plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = 'dev.fnex'
base { archivesName = "fnex-client-${project.minecraft_version}" }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc": project.minecraft_version
    }
}

// version specific code lives in src/mc26_2 and src/mc26_3
sourceSets.main.java.srcDir "src/mc" + project.minecraft_version.replace('.', '_') + "/java"

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
